<!DOCTYPE html>
<!-- DynamicCourts.html version15 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Court Session Manager</title>
    <link rel="stylesheet" href="DynamicCourts.css">
    <link rel="stylesheet" href="MidSessionSelectedPlayers.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            position: relative;
            background-color: #fefefe;
            margin: 10%;
            padding: 5px;
            width: 80%;
            animation-name: animatetop;
            animation-duration: 0.4s;
        }
        @keyframes animatetop {
            from {top: -300px; opacity: 0}
            to {top: 0; opacity: 1}
        }
        .close {
            position: absolute;
            right: 36px;
            top: 0;
            color: #fff;
            font-size: 52px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="session-number">Session 1</div>
        <div id="timer">00:00</div>
        <div>
            Session Duration: <input type="number" id="duration-input"> minutes
        </div>

        <!-- Players Button -->
        <div style="position: relative;">
            <button class="header-btn" id="players-icon">&#128100; Players</button>
        </div>

        <!-- Courts Button -->
        <div style="position: relative;">
            <button class="header-btn" id="courts-icon">⚾ Courts</button>
        </div>

        <!-- Settings Dropdown -->
        <div style="position: relative;">
            <button class="header-btn" id="setting-icon">&#9881; Settings</button>
            <div id="setting-buttons" class="settings-dropdown">
                <button class="header-btn" id="pause-btn">Pause</button>
                <button class="header-btn" id="reshuffle-btn">Reshuffle</button>
                <!-- <button class="header-btn" id="reset-btn">Reset</button> -->
                <button class="header-btn" id="next-btn">Next</button>
                <!--  <button class="header-btn" id="prev-btn">Prev</button> -->
                <button class="header-btn" id="FreshStart-btn">FreshStart</button>
            </div>
        </div>
    </div>

    <div id="content"></div>
    <div id="rested-players">
        <h3>Rested Players</h3>
        <div class="players-container"></div>
    </div>

    <!-- Players Modal -->
    <div id="playerModal" class="modal player-selection-modal">
        <div class="modal-content teal-bg">
            <span class="close player-close">&times;</span>
            <div class="center-content">
                <div class="search-container">
                    <button id="voteFilterBtn" class="vote-toggle-btn">Voted for Today</button>
                    <input type="text" id="searchBar" placeholder="Search players...">
                </div>
                <div class="division-container">
                    <span class="division-label">Division:</span>
                
                    <!-- 13 toggle pills -->
                    <button class="div-toggle-btn" data-div="1">1</button>
                    <button class="div-toggle-btn" data-div="2">2</button>
                    <button class="div-toggle-btn" data-div="3">3</button>
                    <button class="div-toggle-btn" data-div="4">4</button>
                    <button class="div-toggle-btn" data-div="5">5</button>
                    <button class="div-toggle-btn" data-div="6">6</button>
                    <button class="div-toggle-btn" data-div="7">7</button>
                    <button class="div-toggle-btn" data-div="8">8</button>
                    <button class="div-toggle-btn" data-div="9">9</button>
                    <button class="div-toggle-btn" data-div="10">10</button>
                    <button class="div-toggle-btn" data-div="11">11</button>
                    <button class="div-toggle-btn" data-div="12">12</button>
                    <button class="div-toggle-btn" data-div="13">13</button>
                </div>
                <div id="playerList" class="responsive-grid"></div>
            </div>
            <div id="alphabetScrollBar"></div>
        </div>
    </div>

    <!-- Courts Modal -->
    <div id="courtModal" class="modal">
        <div class="modal-content" style="height: 80vh; width: 90vw;">
            <span class="close court-close">&times;</span>
            <iframe id="courtConfigFrame" src="MidSessionPlayDayConfig.html" 
                    style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

    <div id="loading-indicator" style="display: none;">Loading... Please wait.</div>

    <script src="DynamicCourts.js"></script>
    <script src="MidSessionSelectedPlayers.js"></script>
         <script>
                 // MINIMAL DEFENSIVE INITIALIZATION
                 document.addEventListener('DOMContentLoaded', function() {
                     const playerModal = document.getElementById('playerModal');
                     if (playerModal) {
                         // Just ensure it's hidden, don't block pointer events
                         playerModal.style.display = 'none';
                         playerModal.style.opacity = 0;
                     }
                 });
                 // Safely get elements
                 const playerModal = document.getElementById('playerModal');
                 const courtModal = document.getElementById('courtModal');
                 const playerClose = document.querySelector('#playerModal .player-close');
                 const courtClose = document.querySelector('#courtModal .court-close');
                 const settingIcon = document.getElementById('setting-icon');
                 const settingButtons = document.getElementById('setting-buttons');
         
                 // Settings Dropdown Handling
                 settingIcon.addEventListener('click', function(event) {
                     event.stopPropagation(); // Prevent event from bubbling up
                     const isVisible = settingButtons.style.display === 'block';
                     settingButtons.style.display = isVisible ? 'none' : 'block';
                 });
         
                 // Close settings dropdown when clicking anywhere on the screen
                 document.addEventListener('click', function(event) {
                     // Check if click is outside settings dropdown and button
                     if (!settingIcon.contains(event.target) && !settingButtons.contains(event.target)) {
                         settingButtons.style.display = 'none';
                     }
                 });
         
                 // Robust close function that blocks event bubbling
                 function closePlayerModal(event) {
                     if (event) {
                         event.stopPropagation();
                         event.preventDefault();
                     }
                     playerModal.style.display = 'none';
                     playerModal.style.opacity = 0;
                     console.log('[PLAYERS] Modal closed');
                     if (typeof updateRestedPlayersOnModalClose === 'function') {
                         updateRestedPlayersOnModalClose();
                     }
                 }
           
                 // Players Modal Handling - CORRECTED
                 document.getElementById('players-icon').addEventListener('click', () => {
                     playerModal.style.display = "block";  // ✅ CORRECT: Show the modal
                     setTimeout(() => playerModal.style.opacity = 1, 10);
                 });
         
                 if(playerClose) {
                     playerClose.onclick = closePlayerModal;  // ✅ CORRECT: Close the modal
                 }
         
                 // Prevent modal-content clicks from closing modal
                 const playerModalContent = document.querySelector('#playerModal .modal-content');
                 if (playerModalContent) {
                     playerModalContent.onclick = function(event) {
                         event.stopPropagation();
                     };
                 }
         
                 // Player Modal backdrop click handling
                 playerModal.onclick = function(event) {
                     if (event.target === playerModal) {
                         closePlayerModal(event);
                     }
                 };
         
                 // Courts Modal Handling
                 document.getElementById('courts-icon').addEventListener('click', () => {
                     courtModal.style.display = "flex";
                     //document.getElementById('courtConfigFrame').contentWindow.location.reload();
                 });
         
                 if(courtClose) {
                    courtClose.onclick = () => {
                         courtModal.style.display = "none";
                         console.log('[COURTS] Modal closed via X button');
         
                         // Delay the check for 'PlayDayConfig:winreload'
                         setTimeout(() => {
                            const config = JSON.parse(localStorage.getItem('PlayDayConfig'));
                            if (config && config.winreload === 1) {
                              config.winreload = 0;
                              localStorage.setItem('PlayDayConfig', JSON.stringify(config));
                              window.location.reload();
                            }
                         }, 200); // 200ms delay
                     };
                 }
         
                 // Background Click Handling - Only for Court Modal now
                 window.onclick = function(event) {
                     if(event.target === courtModal) {
                         courtModal.style.display = "none";
                         console.log('[COURTS] Modal closed via background');
                          // Delay the check for 'PlayDayConfig:winreload'
                         setTimeout(() => {
                            const config = JSON.parse(localStorage.getItem('PlayDayConfig'));
                            if (config && config.winreload === 1) {
                              config.winreload = 0;
                              localStorage.setItem('PlayDayConfig', JSON.stringify(config));
                              window.location.reload();
                            }
                         }, 200); // 200ms delay
                     }
                 };
         
                 // Reset PlayDayConfig:winreload to 0 after reload (ensure it only runs once)
                 if (localStorage.getItem('PlayDayConfig:winreload') === '1') {
                     localStorage.setItem('PlayDayConfig:winreload', '0');
                     console.log("PlayDayConfig:winreload reset to 0 after reload.");
                 }
         
         </script>
</body>
</html>
