<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You Page</title>
    <style>
        body {
            background-color: #FEFEFE;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            color: black;
        }

        #message {
            font-size: 3em;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="message">Thank You !!</div>

    <script>
        function playBeep() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.2);
                
                console.log('Beep attempted');
            } catch (error) {
                console.log('Beep failed:', error);
            }
        }

        window.addEventListener('load', function() {
            console.log('Starting beeps...');
            
            // Beep every 500ms for 1 minute
            const interval = setInterval(playBeep, 500);
            
            // Stop after 1 minute
            setTimeout(() => {
                clearInterval(interval);
                console.log('Beeps stopped');
            }, 60000);
        });
    </script>
</body>
</html>
