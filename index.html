<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustClubs Court</title>

  <link rel="stylesheet" href="styles.css">
  <script src="index.js" defer></script>
</head>
<body class="teal-bg">
  <div class="center-content">
    <h1 class="logo-gradient">Just<span class="clubs-gradient">Clubs</span></h1>
    <form id="clubForm" class="profile-form">
      <!-- Club selector -->
      <select id="clubSelect" class="profile-input" required>
        <option value="" disabled selected>Loading club list…</option>
      </select>

      <!-- Fixed username -->
      <input
        type="email"
        id="username"
        value="volunteer@justclubs.ie"
        readonly
        class="profile-input"
      >

      <!-- Password -->
      <input
        type="text"
        id="password"
        placeholder="Password"
        required
        class="profile-input"
      >

      <div class="button-row">
        <button type="submit" class="welcome-btn">Enter</button>
        <button type="button" id="resetBtn" class="welcome-btn">Reset</button>
      </div>
    </form>
  </div>
</body>
</html>
